services:
  postgres:
    image: postgres:18-alpine
    container_name: smartpackage-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: smartpackage
    volumes:
      # Postgres 18's image stores data in a major-version subdirectory, so the
      # mount goes at /var/lib/postgresql — not /var/lib/postgresql/data, which
      # every pre-18 example uses and which makes the container refuse to start.
      - postgres-data:/var/lib/postgresql
      # Runs once, on first initialisation of the volume.
      - ./docker/init-test-db.sql:/docker-entrypoint-initdb.d/init-test-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d smartpackage"]
      interval: 2s
      timeout: 3s
      retries: 15

  # Profiled, so a bare `docker compose up` still serves the database only and
  # the app runs from `pnpm dev` against it. `--profile demo` runs both.
  app:
    profiles: ["demo"]
    build:
      context: .
      args:
        # Build-time, not runtime: Next inlines NEXT_PUBLIC_* into the client
        # bundle, and NODE_ENV is production here.
        NEXT_PUBLIC_DEMO_MODE: "true"
    container_name: smartpackage-app
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/smartpackage
      BETTER_AUTH_URL: http://localhost:3000
      # Demo-only, committed on purpose so the stack runs with no setup. Rotating
      # it invalidates every session. A real deployment generates its own:
      # openssl rand -base64 32
      BETTER_AUTH_SECRET: demo-only-secret-not-for-any-real-deployment
      NEXT_PUBLIC_DEMO_MODE: "true"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres-data:
